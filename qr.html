<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码彩蛋</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; display: flex;
    align-items: center; justify-content: center;
    background: #fff8e1; color: #222;
    font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    text-align: center; padding: 24px;
  }
  .box { max-width: 90vw; }
  .emoji { width: clamp(110px, 30vw, 200px); margin-bottom: 10px; }
  h1 { font-size: clamp(28px, 8vw, 56px); margin: 0 0 18px; color: #e53935; line-height: 1.3; }
  p { font-size: clamp(16px, 4.5vw, 24px); margin: 0; color: #555; }
</style>
</head>
<body>
  <div class="box">
    <img class="emoji" src="laugh.gif" alt="笑哭表情">
    <h1>你是SB吗，哈哈，加表请</h1>
    <p>—— 朋友，你被套路了</p>
  </div>
</body>
</html>
